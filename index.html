<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Nights at Claude's</title>
<style>
:root{box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#ddd;font-family:"Courier New",monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:800px;height:600px;flex:none;overflow:hidden;background:#050505;border:4px solid #222;box-shadow:0 0 60px #000,inset 0 0 120px #000;transform-origin:center}
#office{position:absolute;inset:0;z-index:1;overflow:hidden;background:#050505}
#office.stR{background-image:linear-gradient(270deg,#bbb 0,#555 25%,#1a1a1c 55%,#000 100%)}
#office.stW{background-image:radial-gradient(ellipse at 50% 35%,#bbb 0,#555 35%,#111 80%)}
#desk{position:absolute;left:230px;right:230px;bottom:0;height:150px;background:linear-gradient(#1c1c1c,#0a0a0a);border-top:3px solid #333;border-radius:20px 20px 0 0}
#wnd{position:absolute;left:240px;top:70px;width:320px;height:250px;border:10px solid #555;border-radius:6px;background:linear-gradient(135deg,#0a1218,#050a0e);box-shadow:inset 0 0 40px #000,0 0 20px #000;overflow:hidden}
#wnd::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.12) 0 18%,transparent 18% 30%,rgba(255,255,255,.06) 30% 36%,transparent 36%);pointer-events:none}
#wnd.lit{background:linear-gradient(135deg,#9ab,#567);box-shadow:inset 0 0 60px #fff,0 0 40px #cde}
#wAl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.35;filter:brightness(.6)}
#wnd.lit #wAl{opacity:1;filter:none}
.door{position:absolute;right:10px;top:30px;bottom:30px;width:130px;border:6px solid #555;background:rgba(0,0,0,.2);transition:all .25s}
.door.closed{background:repeating-linear-gradient(0deg,#3a3d42,#3a3d42 18px,#2a2c30 18px,#2a2c30 22px);border-color:#777;box-shadow:inset 0 0 30px #000}
.btn2{font:bold 12px monospace;padding:7px 10px;background:#400;color:#fff;border:2px solid #777;cursor:pointer;border-radius:3px}
.btn2.on{background:#0a0;border-color:#6f6}
.btn2:disabled{opacity:.4;cursor:default}
#ctlR{position:absolute;right:155px;top:240px;display:flex;flex-direction:column;gap:8px;padding:8px;background:#161616;border:2px solid #444;border-radius:6px;z-index:5}
#lW{position:absolute;left:50%;top:340px;transform:translateX(-50%);z-index:5;font-size:13px;padding:9px 14px}
#warnR{position:absolute;right:20px;top:90px;width:200px;text-align:center;color:#e00;font-weight:bold;font-size:15px;display:none;z-index:4;text-shadow:0 0 8px #f00}
#dAl{display:block;height:90px;font-size:70px;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 0 6px #f00)}
#pum{position:absolute;top:250px;left:50%;transform:translateX(-50%);font-size:70px;font-weight:bold;color:#f33;display:none;z-index:6;text-shadow:0 0 15px #f00}
#hud{position:absolute;inset:0;pointer-events:none;z-index:30}
#clock{position:absolute;top:12px;right:16px;font-size:30px;color:#eee;text-shadow:0 0 8px #fff}
#night{position:absolute;top:50px;right:16px;font-size:14px;color:#aaa}
#pw{position:absolute;left:16px;bottom:16px;font-size:14px}
#bar{width:180px;height:18px;border:2px solid #888;margin-top:4px;background:#111}
#fill{height:100%;width:100%;background:#2d2;transition:width .1s}
#flip{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:10px;font:bold 16px monospace;padding:12px 34px;background:#222;color:#eee;border:3px solid #888;cursor:pointer;border-radius:4px}
#flip:hover{background:#444}
#camIcon{height:24px;display:none}
#mon{position:absolute;inset:0;z-index:20;display:none;background:#0b120b}
#mon::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 4px);animation:scan .4s linear infinite;pointer-events:none}
#mon::after{content:"";position:absolute;inset:0;background:#fff;opacity:.05;animation:flick .15s steps(2) infinite;pointer-events:none}
@keyframes scan{to{background-position:0 4px}}
@keyframes flick{0%{opacity:.02}50%{opacity:.12}100%{opacity:.04}}
#view{position:absolute;left:30px;top:60px;width:440px;height:380px;border:3px solid #9c9;background:#0d1a0d;color:#9f9;padding:20px}
#view h2{margin:0 0 10px;font-size:22px}
#view p{font-size:18px}
#map{position:absolute;right:30px;top:80px;width:290px;height:260px;border:2px solid #696}
#map svg{position:absolute;inset:0}
.cam{position:absolute;width:110px;font:bold 12px monospace;padding:8px 4px;background:#132;color:#9f9;border:2px solid #6a6;cursor:pointer;z-index:2}
.cam.sel{background:#6a6;color:#000}
#c1A{left:90px;top:12px}#c1B{left:90px;top:92px}#c2A{left:10px;top:185px}#c2B{left:170px;top:185px}
#rec{position:absolute;top:18px;left:30px;color:#f33;font-size:18px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.screen{position:absolute;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000 center/cover}
.btn{font:bold 20px monospace;padding:12px 36px;background:#111;color:#fff;border:3px solid #fff;cursor:pointer;margin-top:30px;position:relative}
.btn:hover{background:#fff;color:#000}
#start{display:flex}
#start h1{font-size:44px;margin:0;color:#d33;text-shadow:0 0 15px #a00;position:relative}
#start .n{font-size:28px;margin-top:30px;animation:blink 1s steps(2) infinite;position:relative}
#win h1{font-size:110px;margin:0;color:gold;text-shadow:0 0 30px #fa0}
#win .c{font-size:28px;color:#ffd;animation:bounce .5s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-14px) scale(1.1)}}
#scare{background:#c00;animation:shake .06s infinite,flash .15s steps(2) infinite}
#sj{position:absolute;inset:0;background:center/cover;animation:blink .12s steps(2) infinite}
#scare .boo{font-size:130px;font-weight:bold;color:#000;text-shadow:0 0 20px #fff;position:relative}
#scare .who{font-size:90px;position:relative}
#scare.done{animation:none;background:#300}
#scare.done #sj{animation:none;opacity:.5}
@keyframes shake{0%{transform:translate(8px,-6px)}25%{transform:translate(-9px,7px)}50%{transform:translate(6px,9px)}75%{transform:translate(-7px,-8px)}100%{transform:translate(9px,5px)}}
@keyframes flash{50%{background:#f00}}
#black{position:absolute;inset:0;background:#000;z-index:90;display:none;align-items:center;justify-content:center;color:#400;font-size:22px}
/* Ajuste a las imágenes: la ventana y la puerta ya vienen dibujadas en las fotos */
#desk,.door{display:none}
#wnd{left:94px;top:166px;width:306px;height:237px;border:0;border-radius:0;background:none;box-shadow:none}
#wnd::after{display:none}
#wnd.lit{background:none;box-shadow:none}
#wLit{position:absolute;left:94px;top:166px;width:306px;height:237px;display:none;background-color:#9ab;background-repeat:no-repeat;background-size:1326px 600px;background-position:-502px -166px}
#wAl{font-size:110px}
#warnR{right:auto;left:480px;top:130px;width:220px}
#dAl{height:150px;font-size:120px}
#ctlR{right:10px;top:290px}
#lW{left:90px;top:430px;transform:none}
/* ===== Vista panorámica: posiciones en % del ancho/alto de la imagen (ajústalas a tu textura) ===== */
#world{position:absolute;left:0;top:0;height:600px;width:1326px;background:#111 radial-gradient(ellipse at 50% 40%,#2a2a2e 0%,#111 60%,#000 100%) center/100% 100% no-repeat;will-change:transform}
#wLit{left:0;top:0;width:100%;height:100%;background-size:100% 100%;background-position:0 0;clip-path:inset(27.6% 39.1% 32.9% 37.9%)}
#wnd{left:37.9%;top:27.6%;width:23%;height:39.5%}
#warnR{left:67%}
#ctlR{right:8.9%;top:48%}
#lW{left:37.6%;top:71.7%}
.edge{position:absolute;top:50%;margin-top:-20px;font-size:34px;color:#fff;opacity:.3;pointer-events:none;z-index:3;transition:opacity .2s}
#edgeL{left:8px}#edgeR{right:8px}
#black{background:#000 no-repeat;background-size:auto 100%;background-position:50% 50%;align-items:flex-end;padding-bottom:90px;color:#611;text-shadow:0 0 6px #000}
</style>
</head>
<body>
<div id="game">
  <div id="office">
    <div id="world">
    <div id="wLit"></div>
    <div id="wnd"><div id="wAl"></div></div>
    <div id="warnR"><span id="dAl"></span>¡ALGUIEN EN EL PASILLO!</div>
    <div id="ctlR"><button class="btn2" id="dR">DOOR</button><button class="btn2" id="lR">LIGHT</button></div>
    <button class="btn2" id="lW">VENTANA - ENCENDER LUZ</button>
    </div>
    <div id="pum">*PUM*</div>
    <div class="edge" id="edgeL">◀</div><div class="edge" id="edgeR">▶</div>
  </div>
  <div id="mon">
    <div id="rec">● REC</div>
    <div id="view"><h2 id="vt"></h2><p id="vp"></p></div>
    <div id="map">
      <svg viewBox="0 0 290 260"><g stroke="#6a6" stroke-width="2" fill="none"><path d="M145 45V92M145 125L65 185M145 125L225 185"/></g></svg>
      <button class="cam" id="c1A">CAM 1A<br>Show Stage</button>
      <button class="cam" id="c1B">CAM 1B<br>Dining Area</button>
      <button class="cam" id="c2A">CAM 2A<br>West Hall</button>
      <button class="cam" id="c2B">CAM 2B<br>East Hall</button>
    </div>
  </div>
  <div id="hud">
    <div id="clock">12 AM</div><div id="night">Night 1</div>
    <div id="pw">Power: <span id="pv">100</span>%<div id="bar"><div id="fill"></div></div></div>
  </div>
  <button id="flip"><img id="camIcon" alt=""><span>FLIP MONITOR</span></button>
  <div id="black">⚡ SIN ENERGÍA ⚡</div>
  <div class="screen" id="start"><h1>FIVE NIGHTS AT CLAUDE'S</h1><div class="n">NIGHT 1</div><button class="btn" id="go">START GAME</button></div>
  <div class="screen" id="victory"><h1>6:00 AM</h1><div class="c">🔔 ¡Yay! ¡Los niños celebran! 🎉 🔔</div><button class="btn" id="again">JUGAR DE NUEVO</button></div>
  <div class="screen" id="scare"><div id="sj"></div><div class="who" id="sw">🐻</div><div class="boo">¡¡BOO!!</div><button class="btn" id="retry" style="display:none">RETRY</button></div>
</div>

const URL_VENTANA_ALERTA      = '';  // Animatrónico asomado en la ventana
const URL_PUERTA_ALERTA       = '';  // Animatrónico en el pasillo derecho
const URL_JUMPSCARE           = '';  // Imagen que parpadea en el Game Over
const URL_ICONO_CAMARA        = '';  // Icono del botón del monitor
/* ========================================================== */

const $=id=>document.getElementById(id);
const bg=(el,u)=>{el.style.backgroundImage=u?'url("'+u+'")':''};
const P1=['1A','1B','VT'],P2=['1A','2B','DR'];
const NAMES=['12 AM','1 AM','2 AM','3 AM','4 AM','5 AM'];
const ROOMS={'1A':'Show Stage','1B':'Dining Area','2A':'West Hall','2B':'East Hall'};
let S=null,loop=null,tick=null;

function fit(){$('game').style.transform='scale('+Math.min(innerWidth/810,innerHeight/610,1.5)+')'}
addEventListener('resize',fit);fit();

function initImages(){
  bg($('start'),URL_FONDO_INICIO);
  bg($('sj'),URL_JUMPSCARE);
  bg($('wLit'),URL_OFICINA_LUZ_VENTANA);
  bg($('black'),URL_OFICINA_APAGON);
  const w=$('wAl'),d=$('dAl');
  if(URL_VENTANA_ALERTA){bg(w,URL_VENTANA_ALERTA);w.textContent=''}else w.textContent='👤';
  if(URL_PUERTA_ALERTA){bg(d,URL_PUERTA_ALERTA);d.textContent=''}else d.textContent='👤';
  const ic=$('camIcon');
  if(URL_ICONO_CAMARA){ic.src=URL_ICONO_CAMARA;ic.style.display='block';ic.onerror=()=>{ic.style.display='none'}}
}
initImages();

/* ===== VISTA PANORÁMICA (mover el ratón a los bordes, arrastrar con el dedo o usar ← →) ===== */
const PAN_START=0.78, PAN_SPEED=9, VIEW_W=800;
let worldW=URL_OFICINA_NORMAL?1326:800,panX=0,panV=0,keyV=0;
function setPan(x){
  panX=Math.max(0,Math.min(worldW-VIEW_W,x));
  $('world').style.transform='translateX('+(-panX)+'px)';
  $('edgeL').style.opacity=panX>1?.35:0;
  $('edgeR').style.opacity=panX<worldW-VIEW_W-1?.35:0;
}
function setWorld(w){worldW=Math.max(VIEW_W,w);$('world').style.width=worldW+'px';setPan((worldW-VIEW_W)*PAN_START)}
(function(){
  setWorld(worldW);
  /* El ancho del mundo se calcula solo a partir de la proporción de tu imagen (alto fijo de 600px) */
  const src=URL_OFICINA_NORMAL||URL_OFICINA_PUERTA_CERRADA||URL_OFICINA_LUZ_DERECHA;
  if(src){const im=new Image();im.onload=()=>setWorld(Math.round(600*im.naturalWidth/im.naturalHeight));im.src=src}
  const g=$('game');
  g.addEventListener('pointermove',e=>{
    const r=g.getBoundingClientRect(),f=(e.clientX-r.left)/r.width*2-1;
    panV=Math.abs(f)<0.35?0:Math.sign(f)*(Math.abs(f)-0.35)/0.65;
  });
  g.addEventListener('pointerleave',()=>{panV=0});
  addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keyV=-1;if(e.key==='ArrowRight')keyV=1});
  addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')keyV=0});
  let last=performance.now();
  (function anim(t){
    const dt=Math.min(50,t-last)/16.67;last=t;
    if(!(S&&(S.mon||S.over||S.out))){const v=keyV||panV;if(v)setPan(panX+v*PAN_SPEED*dt)}
    requestAnimationFrame(anim);
  })(last);
})();

function show(id,on){$(id).style.display=on?'flex':'none'}
function stopAll(){clearInterval(loop);clearInterval(tick);loop=tick=null}

function startGame(){
  stopAll();
  S={power:100,time:0,dr:false,lr:false,lw:false,mon:false,cam:'1A',out:false,over:false,
     a1:{pos:0,dead:0},a2:{pos:0,dead:0},outAt:0};
  ['start','victory','scare'].forEach(i=>show(i,false));
  $('scare').classList.remove('done');$('retry').style.display='none';
  $('black').style.display='none';$('mon').style.display='none';$('pum').style.display='none';
  loop=setInterval(frame,100);
  tick=setInterval(aiTick,4000);
  render();
}

function names(room){
  const n=[];
  if(P1[S.a1.pos]===room)n.push('Bon-Bon');
  if(P2[S.a2.pos]===room)n.push('Freddy');
  return n;
}

function render(){
  const h=Math.min(5,Math.floor(S.time/20));
  $('clock').textContent=NAMES[h];
  const p=Math.max(0,Math.ceil(S.power));
  $('pv').textContent=p;
  const f=$('fill');f.style.width=p+'%';
  f.style.background=p>50?'#2d2':p>20?'#dd2':'#d22';
  $('dR').classList.toggle('on',S.dr);
  $('lR').classList.toggle('on',S.lr);
  $('lW').classList.toggle('on',S.lw);
  $('lW').textContent=S.lw?'VENTANA - APAGAR LUZ':'VENTANA - ENCENDER LUZ';
  $('wnd').classList.toggle('lit',S.lw);
  const o=$('world');
  o.className='';
  bg(o,S.dr?URL_OFICINA_PUERTA_CERRADA:S.lr?URL_OFICINA_LUZ_DERECHA:URL_OFICINA_NORMAL);
  $('wLit').style.display=S.lw?'block':'none';
  $('wAl').style.display=(P1[S.a1.pos]==='VT')?'flex':'none';
  $('warnR').style.display=(S.lr&&P2[S.a2.pos]==='DR'&&!S.dr)?'block':'none';
  $('mon').style.display=S.mon?'block':'none';
  ['1A','1B','2A','2B'].forEach(r=>$('c'+r).classList.toggle('sel',r===S.cam));
  const n=names(S.cam);
  $('vt').textContent='CAM '+S.cam+' — '+ROOMS[S.cam];
  $('vp').textContent='CAM '+S.cam+': ['+(n.length?n.join(', '):'Vacía')+']';
  const dis=S.out||S.over;
  ['dR','lR','lW','flip'].forEach(i=>$(i).disabled=dis);
}

function frame(){
  if(S.over)return;
  const now=performance.now();
  S.time+=0.1;
  if(S.out){
    if(now-S.outAt>=4000)jumpscare('🐻');
    return;
  }
  if(S.time>=120){win();return}
  const rate=1/3+(S.dr?.5:0)+(S.lr?1:0)+(S.lw?1:0)+(S.mon?.5:0);
  S.power-=rate*0.1;
  if(S.power<=0){blackout();return}
  const a=S.a1,b=S.a2;
  if(P1[a.pos]==='VT'){
    if(S.lw){a.pos=0}else if(now>a.dead){jumpscare('🐰');return}
  }
  if(P2[b.pos]==='DR'){
    if(S.dr){pum();b.pos=0}else if(now>b.dead){jumpscare('🐻');return}
  }
  render();
}

function aiTick(){
  if(!S||S.over||S.out)return;
  const now=performance.now(),a=S.a1,b=S.a2;
  if(P1[a.pos]!=='VT'&&Math.random()<0.6){
    a.pos++;
    if(P1[a.pos]==='VT')a.dead=now+5000;
  }
  if(P2[b.pos]!=='DR'&&Math.random()<0.4){
    b.pos++;
    if(P2[b.pos]==='DR')b.dead=now+4000;
  }
  render();
}

function pum(){
  const e=$('pum');e.style.display='block';
  setTimeout(()=>{e.style.display='none'},900);
}

function blackout(){
  S.out=true;S.power=0;S.outAt=performance.now();
  S.dr=S.lr=S.lw=S.mon=false;
  render();
  const fr=worldW>VIEW_W?panX/(worldW-VIEW_W):0.5;
  $('black').style.backgroundPosition=(fr*100)+'% 50%';
  $('black').style.display='flex';
}

function jumpscare(icon){
  if(S.over)return;
  S.over=true;stopAll();
  $('black').style.display='none';$('mon').style.display='none';
  $('sw').textContent=URL_JUMPSCARE?'':icon;
  show('scare',true);
  setTimeout(()=>{$('scare').classList.add('done');$('retry').style.display='block'},2000);
}

function win(){
  S.over=true;stopAll();
  $('mon').style.display='none';
  show('victory',true);
}

const ok=()=>S&&!S.out&&!S.over;
$('dR').onclick=()=>{if(ok()){S.dr=!S.dr;render()}};
$('lR').onclick=()=>{if(ok()){S.lr=!S.lr;render()}};
$('lW').onclick=()=>{if(ok()){S.lw=!S.lw;render()}};
/* Al abrir el monitor se apagan las luces de la oficina: no se solapan con las cámaras */
$('flip').onclick=()=>{if(ok()){S.mon=!S.mon;if(S.mon){S.lr=false;S.lw=false}render()}};
['1A','1B','2A','2B'].forEach(r=>$('c'+r).onclick=()=>{if(ok()){S.cam=r;render()}});
$('go').onclick=startGame;
$('again').onclick=startGame;
$('retry').onclick=startGame;
</script>
</body>
</html>
